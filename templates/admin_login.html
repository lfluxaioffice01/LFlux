<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LFlux Admin | 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='admin.css') }}">
</head>
<body class="admin-body admin-body--login">
  <div class="admin-login">
    <div class="admin-login__card">
      <a href="/" class="admin-login__logo">LFlux</a>
      <p class="admin-login__subtitle">관리자 로그인</p>
      {% if error %}
      <div class="admin-alert admin-alert--error" role="alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="/admin/login" class="admin-login__form">
        <div class="admin-field">
          <label for="username">아이디</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="admin-field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="admin-btn admin-btn--primary admin-btn--full">로그인</button>
      </form>
    </div>
  </div>
</body>
</html>
